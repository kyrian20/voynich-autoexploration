name: Voynich exp606 gap boundary lexical audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/exp_606_gap_boundary_lexical_audit/script.py'
      - 'data/transcriptions/eva_zl3b.txt'
      - 'data/transcriptions/eva_it2a.txt'
      - 'scripts/audit_ivtff_metadata.py'
      - '.github/workflows/voynich-exp606.yml'

# Serialize all workflows that write results to master.
concurrency:
  group: voynich-exp606
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare lexical distributions around known foliation gaps
        run: python experiments/exp_606_gap_boundary_lexical_audit/script.py
      - name: Conservar resultados reproducidos
        uses: actions/upload-artifact@v4
        with:
          name: voynich-exp606-results
          path: |
            experiments/exp_606_gap_boundary_lexical_audit/results.json
            experiments/exp_606_gap_boundary_lexical_audit/result.md
          if-no-files-found: error
          retention-days: 90
