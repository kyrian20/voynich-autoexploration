name: Voynich exp606 gap boundary lexical audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/exp_606_gap_boundary_lexical_audit/script.py'
      - 'data/transcriptions/eva_zl3b.txt'
      - 'data/transcriptions/eva_it2a.txt'
      - 'scripts/audit_ivtff_metadata.py'
      - '.github/workflows/voynich-exp606.yml'

# Serialize all workflows that write results to master.
concurrency:
  group: voynich-exp606
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare lexical distributions around known foliation gaps
        run: python experiments/exp_606_gap_boundary_lexical_audit/script.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/exp_606_gap_boundary_lexical_audit/results.json experiments/exp_606_gap_boundary_lexical_audit/result.md
          git diff --cached --quiet || git commit -m "Record exp606 gap boundary lexical audit"
          for attempt in 1 2 3 4 5; do
            git fetch origin master:refs/remotes/origin/master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite results." >&2
              exit 1
            fi
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying after refresh."
            sleep "$((attempt * 2))"
          done
          echo "Push failed after five attempts." >&2
          exit 1
