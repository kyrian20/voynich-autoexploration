name: Voynich Corpus Experiments

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_589_daiin_position_audit/**"
      - "data/transcriptions/eva_zl3b.txt"
      - "data/transcriptions/zl3a.txt"
      - ".github/workflows/voynich-corpus-experiments.yml"

permissions:
  contents: write

concurrency:
  group: voynich-corpus-experiments
  cancel-in-progress: false

jobs:
  daiin-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reproducible corpus audit (no API)
        run: python experiments/exp_589_daiin_position_audit/script.py --permutations 2000
      - name: Upload corpus results artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp-589-daiin-position-audit
          path: experiments/exp_589_daiin_position_audit/results.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit generated results
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain experiments/exp_589_daiin_position_audit/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/exp_589_daiin_position_audit/results.json
            git commit -m "Record reproducible daiin positional audit"
            git push
          else
            echo "No changes to results."
          fi
