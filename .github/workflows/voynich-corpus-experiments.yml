name: Voynich Corpus Experiments

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_589_daiin_position_audit/**"
      - "data/transcriptions/eva_zl3b.txt"
      - "data/transcriptions/zl3a.txt"
      - ".github/workflows/voynich-corpus-experiments.yml"

permissions:
  contents: write

concurrency:
  group: voynich-corpus-experiments
  cancel-in-progress: false

jobs:
  daiin-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check analysis script
        run: python -m py_compile experiments/exp_589_daiin_position_audit/script.py
      - name: Run reproducible corpus audit (no API)
        run: python experiments/exp_589_daiin_position_audit/script.py --permutations 2000
      
      - name: Preserve generated results as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp-589-daiin-audit-results
          path: experiments/exp_589_daiin_position_audit/results.json
          if-no-files-found: error
          retention-days: 90

