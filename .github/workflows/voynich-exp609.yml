name: Voynich exp609 paired ch-sh vowel test

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/exp_609_paired_ch_sh_vowel_test/script.py'
      - 'data/transcriptions/eva_zl3b.txt'
      - 'data/transcriptions/eva_it2a.txt'
      - '.github/workflows/voynich-exp609.yml'

# Serialize all workflows that write results to master.
concurrency:
  group: voynich-exp609
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run paired folio-level test
        run: python experiments/exp_609_paired_ch_sh_vowel_test/script.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add experiments/exp_609_paired_ch_sh_vowel_test/results.json experiments/exp_609_paired_ch_sh_vowel_test/result.md
          git diff --cached --quiet || git commit -m "Record exp609 paired ch-sh vowel test"
          for attempt in 1 2 3 4 5; do
            git fetch origin master:refs/remotes/origin/master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite results." >&2
              exit 1
            fi
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying after refresh."
            sleep "$((attempt * 2))"
          done
          echo "Push failed after five attempts." >&2
          exit 1
