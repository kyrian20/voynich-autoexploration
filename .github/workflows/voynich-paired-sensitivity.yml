name: Voynich Paired Transcription Sensitivity

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_601_primary_statistic_paired_sensitivity/**"
      - "data/transcriptions/eva_zl3b.txt"
      - "data/transcriptions/zl3a.txt"
      - ".github/workflows/voynich-paired-sensitivity.yml"

permissions:
  contents: read

concurrency:
  group: voynich-paired-sensitivity
  cancel-in-progress: false

jobs:
  paired-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_601_primary_statistic_paired_sensitivity/script.py
      - name: Run paired primary-statistic sensitivity (no API)
        run: python experiments/exp_601_primary_statistic_paired_sensitivity/script.py
      - name: Upload paired sensitivity results
        uses: actions/upload-artifact@v4
        with:
          name: exp-601-paired-transcription-sensitivity
          path: experiments/exp_601_primary_statistic_paired_sensitivity/results.json
          if-no-files-found: error
          retention-days: 90
