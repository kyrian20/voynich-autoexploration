name: EXP-590 EXP-593 population reconciliation

on:
  pull_request:
    paths:
      - 'scripts/reconcile_exp590_exp593_population.py'
      - 'research/maintenance/2026-11-16-exp590-exp593-population-reconciliation/**'
      - 'data/transcriptions/eva_zl3b.txt'
      - '.github/workflows/exp590-exp593-population-reconciliation.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile loci and compute exact tails
        run: |
          set -euo pipefail
          python scripts/reconcile_exp590_exp593_population.py --source data/transcriptions/eva_zl3b.txt > reconciliation.json
          python - <<'PY'
          import json, math
          actual = json.load(open("reconciliation.json", encoding="utf-8"))
          archived = json.load(open("research/maintenance/2026-11-16-exp590-exp593-population-reconciliation/result.json", encoding="utf-8"))
          def same(a, b):
              if isinstance(a, dict):
                  assert isinstance(b, dict) and set(a) == set(b)
                  for key in a: same(a[key], b[key])
              elif isinstance(a, list):
                  assert isinstance(b, list) and len(a) == len(b)
                  for x, y in zip(a, b): same(x, y)
              elif isinstance(a, bool):
                  assert isinstance(b, bool) and a == b
              elif isinstance(a, int):
                  assert type(b) is int and a == b
              elif isinstance(a, float):
                  assert isinstance(b, (int, float)) and not isinstance(b, bool)
                  assert math.isclose(a, b, rel_tol=1e-12, abs_tol=1e-15), (a, b)
              else:
                  assert a == b
          same(archived, actual)
          print("generated result matches archived JSON: PASS")
          PY
          python - <<'PY'
          import json, math
          x = json.load(open("reconciliation.json", encoding="utf-8"))
          r = x["locus_reconciliation"]
          assert r["broad"]["nonempty_lines"] == 5376
          assert r["broad"]["tokens"] == 39594
          assert r["restricted"]["nonempty_lines"] == 4188
          assert r["restricted"]["tokens"] == 32732
          assert r["shared_loci"] == 4188
          assert r["shared_raw_rows_and_tokens_identical"] is True
          assert r["only_broad_loci"] == 1188
          assert r["only_broad_tokens"] == 6862
          assert r["only_broad_by_folio_type"] == {"fRos": 160, "numbered_subfolio": 1028}
          assert r["only_restricted_loci"] == r["duplicate_nonempty_loci"] == 0
          full = r["broad"]["variants"]
          narrow = r["restricted"]["variants"]
          assert full["daiin"]["line_initial"] == 161
          assert full["dain"]["line_initial"] == 49
          assert narrow["daiin"]["line_initial"] == 133
          assert narrow["dain"]["line_initial"] == 45
          assert math.isclose(full["daiin"]["holm_adjusted_p"], 2.961392617193513e-7, rel_tol=1e-8)
          assert math.isclose(full["dain"]["holm_adjusted_p"], 9.130814207471987e-6, rel_tol=1e-8)
          assert math.isclose(narrow["daiin"]["holm_adjusted_p"], 5.55358011049914e-5, rel_tol=1e-8)
          print("population reconciliation and exact-tail checks: PASS")
          PY
          sha256sum reconciliation.json > reconciliation.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: exp590-exp593-population-reconciliation
          path: |
            reconciliation.json
            reconciliation.sha256
          if-no-files-found: error
          retention-days: 90
