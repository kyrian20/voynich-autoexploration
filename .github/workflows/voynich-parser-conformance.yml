name: Voynich IVTFF Parser Conformance Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_600_ivtff_parser_conformance/**"
      - "data/transcriptions/eva_zl3b.txt"
      - "data/transcriptions/zl3a.txt"
      - "data/transcriptions/eva_it2a.txt"
      - ".github/workflows/voynich-parser-conformance.yml"

permissions:
  contents: write

concurrency:
  group: voynich-parser-conformance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_600_ivtff_parser_conformance/script.py
      - name: Run structural audit (no API)
        run: python experiments/exp_600_ivtff_parser_conformance/script.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: exp-600-ivtff-parser-conformance
          path: experiments/exp_600_ivtff_parser_conformance/results.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit generated results
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain experiments/exp_600_ivtff_parser_conformance/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/exp_600_ivtff_parser_conformance/results.json
            git commit -m "Record exp_600 IVTFF parser conformance results"
            git push
          else
            echo "No changes to results."
          fi
