name: Voynich Marginal Successor Checks

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_599_marginal_successor_positions/**"
      - "data/transcriptions/eva_zl3b.txt"
      - "data/transcriptions/zl3a.txt"
      - ".github/workflows/voynich-marginal-successors.yml"

permissions:
  contents: read

concurrency:
  group: voynich-marginal-successors
  cancel-in-progress: false

jobs:
  marginal-successors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_599_marginal_successor_positions/script.py
      - name: Run marginal successor tests (no API)
        run: python experiments/exp_599_marginal_successor_positions/script.py --permutations 5000 --top 15
      - name: Upload marginal successor results
        uses: actions/upload-artifact@v4
        with:
          name: exp-599-marginal-successors
          path: experiments/exp_599_marginal_successor_positions/results.json
          if-no-files-found: error
          retention-days: 90
