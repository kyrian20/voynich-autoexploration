name: IVTFF Receipt Verifier Regression

on:
  pull_request:
    paths:
      - 'research/maintenance/verify_pr287_ivtff_artifact.py'
      - 'tests/test_ivtff_receipt_verifier.py'
      - '.github/workflows/ivtff-receipt-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline receipt and tamper regression
        run: |
          python -m unittest discover -s tests -p 'test_ivtff_receipt_verifier.py' -v
          python -O -m unittest discover -s tests -p 'test_ivtff_receipt_verifier.py' -v
