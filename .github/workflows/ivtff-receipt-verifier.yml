name: IVTFF Receipt Verifier Regression

on:
  pull_request:
    paths:
      - 'research/maintenance/verify_pr287_ivtff_artifact.py'
      - 'tests/test_ivtff_receipt_verifier.py'
      - '.github/workflows/ivtff-receipt-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline receipt and tamper regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_ivtff_receipt_verifier.py' -v 2>&1 | tee receipt-regression-normal.log
          python -O -m unittest discover -s tests -p 'test_ivtff_receipt_verifier.py' -v 2>&1 | tee receipt-regression-optimized.log
      - name: Preserve offline regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivtff-receipt-regression-results
          path: receipt-regression-*.log
          if-no-files-found: error
          retention-days: 30
