name: Voynich Line Metadata Checks

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_593_daiin_line_metadata_contrast/**"
      - "data/transcriptions/eva_zl3b.txt"
      - ".github/workflows/voynich-line-metadata-tests.yml"

permissions:
  contents: write

concurrency:
  group: voynich-master-writes
  cancel-in-progress: false

jobs:
  metadata-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_593_daiin_line_metadata_contrast/script.py
      - name: Run line-metadata contrast (no API)
        run: python experiments/exp_593_daiin_line_metadata_contrast/script.py --permutations 5000
      - name: Upload metadata results
        uses: actions/upload-artifact@v4
        with:
          name: exp-593-daiin-line-metadata
          path: experiments/exp_593_daiin_line_metadata_contrast/results.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit generated results
        run: |
          if [ -n "$(git status --porcelain experiments/exp_593_daiin_line_metadata_contrast/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/exp_593_daiin_line_metadata_contrast/results.json
            git commit -m "Record exp_593 line metadata results"
            for attempt in 1 2 3 4 5; do
              git fetch origin master:refs/remotes/origin/master
              if ! git rebase origin/master; then
                git rebase --abort || true
                echo "Rebase conflict; refusing to overwrite results." >&2
                exit 1
              fi
              if git push origin HEAD:master; then
                exit 0
              fi
              echo "Push race on attempt $attempt; retrying after refresh."
              sleep "$((attempt * 2))"
            done
            echo "Push failed after five attempts." >&2
            exit 1
          else
            echo "No changes to results."
          fi
