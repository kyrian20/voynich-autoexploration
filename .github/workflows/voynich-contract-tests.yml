name: Voynich contract tests

on:
  pull_request:
    paths:
      - "scripts/exp622_ch_sh_specificity.py"
      - "scripts/exp623_it2a_ch_sh_specificity.py"
      - "tests/test_exp622_exp623_contract.py"
      - ".github/workflows/voynich-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/exp622_ch_sh_specificity.py scripts/exp623_it2a_ch_sh_specificity.py tests/test_exp622_exp623_contract.py
      - name: Synthetic contract checks
        run: python -m unittest discover -s tests -p 'test_exp622_exp623_contract.py' -v
