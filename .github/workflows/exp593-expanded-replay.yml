name: EXP-593 expanded population archive replay

on:
  pull_request:
    paths:
      - 'scripts/audit_exp593_expanded_population.py'
      - 'research/maintenance/2026-11-04-exp593-expanded-population-sensitivity.json'
      - 'research/maintenance/2026-11-04-exp593-expanded-population-sensitivity.md'
      - 'data/transcriptions/eva_zl3b.txt'
      - '.github/workflows/exp593-expanded-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce and compare immutable archived numerical fields
        run: |
          mkdir -p replay-evidence
          set -o pipefail
          python scripts/audit_exp593_expanded_population.py | tee replay-evidence/replay.json
          sha256sum replay-evidence/replay.json > replay-evidence/replay.sha256
      - name: Preserve reproduction receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp593-expanded-replay-${{ github.run_id }}
          path: replay-evidence/
          if-no-files-found: warn
          retention-days: 90
