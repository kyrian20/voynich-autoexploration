name: Voynich Autonomous Research

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/voynich-agent.yml"
      - "scripts/exp590_daiin_position.py"
      - "scripts/exp593_daiin_variants.py"
      - "scripts/exp622_ch_sh_specificity.py"
      - "scripts/exp623_it2a_ch_sh_specificity.py"
      - "data/transcriptions/eva_it2a.txt"
      - "data/transcriptions/eva_zl3b.txt"
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

# The only workflow permitted to publish generated results to master.
concurrency:
  group: voynich-agent
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit IVTFF Currier language metadata
        run: python scripts/audit_ivtff_metadata.py

      - name: Validate transcription and run reproducible EXP-590
        run: python scripts/exp590_daiin_position.py

      - name: Run EXP-593 variant scan with multiple-testing correction
        run: python scripts/exp593_daiin_variants.py

      - name: Run EXP-622 ch/sh context-specificity interaction
        run: python scripts/exp622_ch_sh_specificity.py

      - name: Run EXP-623 IT2a transcription sensitivity replication
        run: python scripts/exp623_it2a_ch_sh_specificity.py

      - name: Conservar resultados aunque falle la publicación
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-research-${{ github.run_id }}
          path: research/experiments/
          if-no-files-found: error
          retention-days: 90

      - name: Commit experiment report and machine-readable results
        run: |
          if [ -n "$(git status --porcelain research/experiments)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/experiments/
            git commit -m "Record reproducible Voynich experiment outputs"
            # A human or connector can update master during this run.
            # Retry fast-forward races, but never resolve conflicts by overwriting.
            for attempt in 1 2 3 4 5; do
              # Fetch exactly once per attempt. Check the source tree against
              # the triggering commit BEFORE rebasing generated outputs.
              # GitHub-token publication does not trigger a new push CI run.
              if ! git fetch --no-tags origin master; then
                echo "Cannot refresh master; outputs remain in Actions artifacts." >&2
                exit 1
              fi
              if ! python scripts/check_publisher_source_drift.py --base "$GITHUB_SHA" --head origin/master; then
                echo "Source drift detected: a fresh research run is required." >&2
                exit 1
              fi
              if ! git rebase origin/master; then
                git rebase --abort || true
                echo "Publication conflict; outputs are preserved as Actions artifacts." >&2
                exit 1
              fi
              if git push origin HEAD:master; then
                echo "Generated artifacts pushed successfully (attempt ${attempt})."
                exit 0
              fi
              echo "Push race on attempt ${attempt}; retrying after rebase."
              sleep $((attempt * 2))
            done
            echo "Could not push generated artifacts after 5 attempts."
            exit 1
          else
            echo "No experiment output changes to commit."
          fi
