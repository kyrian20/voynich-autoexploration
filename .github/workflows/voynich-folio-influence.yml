name: Voynich Folio Influence Checks

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_592_daiin_folio_influence/**"
      - "data/transcriptions/eva_zl3b.txt"
      - ".github/workflows/voynich-folio-influence.yml"

permissions:
  contents: write

concurrency:
  group: voynich-folio-influence
  cancel-in-progress: false

jobs:
  folio-influence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_592_daiin_folio_influence/script.py
      - name: Run leave-one-folio-out analysis (no API)
        run: python experiments/exp_592_daiin_folio_influence/script.py --top 20
      - name: Upload folio influence results
        uses: actions/upload-artifact@v4
        with:
          name: exp-592-daiin-folio-influence
          path: experiments/exp_592_daiin_folio_influence/results.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit generated results
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain experiments/exp_592_daiin_folio_influence/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/exp_592_daiin_folio_influence/results.json
            git commit -m "Record exp_592 folio influence results"
            git push
          else
            echo "No changes to results."
          fi
