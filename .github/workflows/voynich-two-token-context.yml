name: Voynich Two-Token Context Checks

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_598_two_token_successor_context/**"
      - "data/transcriptions/eva_zl3b.txt"
      - "data/transcriptions/zl3a.txt"
      - ".github/workflows/voynich-two-token-context.yml"

permissions:
  contents: write

concurrency:
  group: voynich-two-token-context
  cancel-in-progress: false

jobs:
  two-token-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_598_two_token_successor_context/script.py
      - name: Run two-token context tests (no API)
        run: python experiments/exp_598_two_token_successor_context/script.py --permutations 5000 --top 15
      - name: Upload two-token context results
        uses: actions/upload-artifact@v4
        with:
          name: exp-598-two-token-context
          path: experiments/exp_598_two_token_successor_context/results.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit generated results
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain experiments/exp_598_two_token_successor_context/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/exp_598_two_token_successor_context/results.json
            git commit -m "Record exp_598 two-token context results"
            git pull --rebase origin master
            git push
          else
            echo "No changes to results."
          fi
