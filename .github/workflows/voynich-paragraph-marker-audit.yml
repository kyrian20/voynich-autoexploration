name: Voynich Paragraph Marker Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_594_daiin_paragraph_start/**"
      - "data/transcriptions/eva_zl3b.txt"
      - ".github/workflows/voynich-paragraph-marker-audit.yml"

permissions:
  contents: read
concurrency:
  group: voynich-paragraph-marker-audit
  cancel-in-progress: false
jobs:
  paragraph-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_594_daiin_paragraph_start/script.py
      - name: Run paragraph marker audit (no API)
        run: python experiments/exp_594_daiin_paragraph_start/script.py --permutations 10000
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: exp-594-paragraph-marker-audit
          path: experiments/exp_594_daiin_paragraph_start/results.json
          if-no-files-found: error
          retention-days: 90
