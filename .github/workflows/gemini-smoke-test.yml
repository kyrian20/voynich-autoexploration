name: Gemini manual connection test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-manual-smoke
  cancel-in-progress: false

jobs:
  connection:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout: manuscript, corpora and research files are unavailable.
      - name: Discover models, validate parameters, make one synthetic request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import json
          import os
          import socket
          import ssl
          from pathlib import Path
          import sys
          import urllib.error
          import urllib.request
          import urllib.parse

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def http_error_category(status):
              # Fixed labels only: never inspect or log remote error details.
              categories = {
                  400: "bad_request",
                  401: "authentication_error",
                  403: "permission_denied",
                  404: "not_found",
                  408: "request_timeout",
                  429: "rate_limit_or_quota",
              }
              if status in categories:
                  return categories[status]
              if 300 <= status < 400:
                  return "redirect_blocked"
              if 400 <= status < 500:
                  return "client_error"
              if 500 <= status < 600:
                  return "server_error"
              return "unexpected_http_status"

          def main():
              report = {"status": "not_started", "attempts": 0,
                        "discovery_requests": 0, "stage": "preflight",
                        "model": None, "manuscript_data_sent": False}
              code = 1
              try:
                  key = os.environ.get("GEMINI_API_KEY", "")
                  if not key:
                      report["status"] = "missing_secret"
                      return code
                  base = "https://generativelanguage.googleapis.com/v1beta/"
                  opener = urllib.request.build_opener(NoRedirect())

                  def get_json(path):
                      request = urllib.request.Request(
                          base + path, headers={"x-goog-api-key": key}, method="GET")
                      report["discovery_requests"] += 1
                      with opener.open(request, timeout=15) as response:
                          return json.loads(response.read(1048576))

                  # Only documented text Flash models, in explicit preference order.
                  # Unknown/multimodal models are never guessed or probed by POST.
                  preference = ("gemini-3.8-flash", "gemini-2.5-flash",
                                "gemini-2.5-flash-lite")
                  report["stage"] = "models_list"
                  available = set()
                  token = ""
                  seen = set()
                  for page in range(10):
                      query = {"pageSize": 1000}
                      if token:
                          query["pageToken"] = token
                      catalog = get_json("models?" + urllib.parse.urlencode(query))
                      for model in catalog["models"]:
                          for name in preference:
                              if (model.get("name") == "models/" + name
                                      and "generateContent" in model.get("supportedGenerationMethods", [])):
                                  available.add(name)
                      token = catalog.get("nextPageToken", "")
                      if not token:
                          break
                      if token in seen:
                          report["status"] = "incomplete_catalog"
                          return code
                      seen.add(token)
                  else:
                      report["status"] = "incomplete_catalog"
                      return code
                  report["available_text_models"] = [n for n in preference if n in available]
                  if not available:
                      report["status"] = "no_compatible_model"
                      return code
                  selected = next(n for n in preference if n in available)
                  report["model"] = selected
                  report["stage"] = "models_get"
                  metadata = get_json("models/" + selected)
                  input_limit = metadata.get("inputTokenLimit")
                  output_limit = metadata.get("outputTokenLimit")
                  if (metadata.get("name") != "models/" + selected
                          or "generateContent" not in metadata.get("supportedGenerationMethods", [])
                          or type(input_limit) is not int or input_limit < 32
                          or type(output_limit) is not int or output_limit < 1024):
                      report["status"] = "incompatible_parameters"
                      return code
                  # Keep model defaults for thinking, temperature and candidate count.
                  # A budget of zero is not portable between thinking model families.
                  config = {"maxOutputTokens": 1024}
                  report["generation_config"] = config
                  report["parameters_verified"] = True
                  payload = {
                      "contents": [{"role": "user", "parts": [
                          {"text": "Reply with exactly OK."}]}],
                      "generationConfig": config,
                  }
                  request = urllib.request.Request(
                      base + "models/" + selected + ":generateContent",
                      data=json.dumps(payload).encode("utf-8"),
                      headers={"Content-Type": "application/json", "x-goog-api-key": key},
                      method="POST",
                  )
                  # Exactly one generation attempt; no retry, fallback or redirect.
                  report["stage"] = "generate_content"
                  report["attempts"] = 1
                  with opener.open(request, timeout=90) as response:
                      report["http_status"] = response.status
                      result = json.loads(response.read(65536))
                  candidates = result.get("candidates", [])
                  text = "".join(part.get("text", "") for part in
                                 candidates[0].get("content", {}).get("parts", [])
                                 if not part.get("thought")) if candidates else ""
                  if text.strip() == "OK":
                      report["status"] = "connected"
                      code = 0
                  else:
                      report["status"] = "unexpected_response"
              except urllib.error.HTTPError as error:
                  report.update(status="http_error", http_status=error.code,
                                error_category=http_error_category(error.code))
                  error.close()
              except (TimeoutError, socket.timeout):
                  report["status"] = "request_timeout"
              except urllib.error.URLError as error:
                  if isinstance(error.reason, (TimeoutError, socket.timeout)):
                      report["status"] = "request_timeout"
                  elif isinstance(error.reason, ssl.SSLError):
                      report["status"] = "tls_error"
                  else:
                      report["status"] = "network_error"
              except ssl.SSLError:
                  report["status"] = "tls_error"
              except (ConnectionError, ConnectionResetError, BrokenPipeError):
                  report["status"] = "network_error"
              except json.JSONDecodeError:
                  report["status"] = "invalid_json_response"
              except (KeyError, TypeError, AttributeError, IndexError, ValueError):
                  report["status"] = "invalid_response_structure"
              except Exception:
                  # Keep only a fixed label; never print exception, URL, headers or credentials.
                  report["status"] = "unexpected_runtime_error"
              finally:
                  Path(os.environ["RUNNER_TEMP"], "gemini-smoke-status.json").write_text(
                      json.dumps(report, indent=2) + "\n", encoding="utf-8")
                  diagnostic = "Gemini connection test status: " + report["status"]
                  if report["status"] == "http_error":
                      diagnostic += (f"; http_status={report['http_status']}"
                                     f"; error_category={report['error_category']}")
                  diagnostic += "; stage=" + report["stage"]
                  print(diagnostic)
              return code

          sys.exit(main())
          PY

      - name: Preserve sanitized connection status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gemini-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gemini-smoke-status.json
          if-no-files-found: warn
          retention-days: 7

