name: Voynich Transcription Concordance Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_600_transcription_concordance/**"
      - "data/transcriptions/eva_zl3b.txt"
      - "data/transcriptions/zl3a.txt"
      - ".github/workflows/voynich-transcription-concordance.yml"

permissions:
  contents: write

concurrency:
  group: voynich-transcription-concordance
  cancel-in-progress: false

jobs:
  concordance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_600_transcription_concordance/script.py
      - name: Run concordance audit (no API)
        run: python experiments/exp_600_transcription_concordance/script.py --examples 40
      - name: Upload concordance results
        uses: actions/upload-artifact@v4
        with:
          name: exp-600-transcription-concordance
          path: experiments/exp_600_transcription_concordance/results.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit generated results
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain experiments/exp_600_transcription_concordance/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/exp_600_transcription_concordance/results.json
            git commit -m "Record exp_600 transcription concordance audit"
            git pull --rebase origin master
            git push
          else
            echo "No changes to results."
          fi
