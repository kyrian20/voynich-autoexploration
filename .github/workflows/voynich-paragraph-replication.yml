name: Voynich Paragraph Marker Replication

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_595_paragraph_marker_replication/**"
      - "data/transcriptions/eva_zl3b.txt"
      - "data/transcriptions/zl3a.txt"
      - ".github/workflows/voynich-paragraph-replication.yml"

permissions:
  contents: write

concurrency:
  group: voynich-paragraph-replication
  cancel-in-progress: false

jobs:
  paragraph-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_595_paragraph_marker_replication/script.py
      - name: Run cross-transcription replication (no API)
        run: python experiments/exp_595_paragraph_marker_replication/script.py --permutations 5000
      - name: Upload replication results
        uses: actions/upload-artifact@v4
        with:
          name: exp-595-paragraph-marker-replication
          path: experiments/exp_595_paragraph_marker_replication/results.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit generated results
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain experiments/exp_595_paragraph_marker_replication/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/exp_595_paragraph_marker_replication/results.json
            git commit -m "Record exp_595 paragraph marker replication"
            git push
          else
            echo "No changes to results."
          fi
