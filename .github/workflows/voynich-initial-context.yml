name: Voynich Initial-Form Context Checks

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_597_initial_form_next_token_context/**"
      - "data/transcriptions/eva_zl3b.txt"
      - "data/transcriptions/zl3a.txt"
      - ".github/workflows/voynich-initial-context.yml"

permissions:
  contents: read

concurrency:
  group: voynich-initial-context
  cancel-in-progress: false

jobs:
  initial-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_597_initial_form_next_token_context/script.py
      - name: Run next-token context analysis (no API)
        run: python experiments/exp_597_initial_form_next_token_context/script.py --permutations 5000 --top 15
      - name: Upload context results
        uses: actions/upload-artifact@v4
        with:
          name: exp-597-initial-form-context
          path: experiments/exp_597_initial_form_next_token_context/results.json
          if-no-files-found: error
          retention-days: 90
