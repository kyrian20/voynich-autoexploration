name: Voynich Line-Level Transcription Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_596_zl3a_zl3b_line_level_audit/**"
      - "data/transcriptions/eva_zl3b.txt"
      - "data/transcriptions/zl3a.txt"
      - ".github/workflows/voynich-line-level-audit.yml"

permissions:
  contents: read

concurrency:
  group: voynich-line-level-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_596_zl3a_zl3b_line_level_audit/script.py
      - name: Run paired audit (no API)
        run: python experiments/exp_596_zl3a_zl3b_line_level_audit/script.py
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: exp-596-line-level-transcription-audit
          path: experiments/exp_596_zl3a_zl3b_line_level_audit/results.json
          if-no-files-found: error
          retention-days: 90
