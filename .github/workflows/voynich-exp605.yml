name: Voynich exp605 folio sequence gap audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/exp_605_folio_sequence_gap_audit/**'
      - '.github/workflows/voynich-exp605.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit transcription headers against fixed missing-folio list
        run: python experiments/exp_605_folio_sequence_gap_audit/script.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/exp_605_folio_sequence_gap_audit/results.json experiments/exp_605_folio_sequence_gap_audit/result.md
          git diff --cached --quiet || git commit -m "Record exp605 folio sequence gap audit"
          git push
