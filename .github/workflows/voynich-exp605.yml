name: Voynich exp605 folio sequence gap audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/exp_605_folio_sequence_gap_audit/script.py'
      - 'data/transcriptions/eva_zl3b.txt'
      - 'data/transcriptions/eva_it2a.txt'
      - '.github/workflows/voynich-exp605.yml'

# Serialize all workflows that write results to master.
concurrency:
  group: voynich-exp605
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit transcription headers against fixed missing-folio list
        run: python experiments/exp_605_folio_sequence_gap_audit/script.py
      - name: Conservar resultados reproducidos
        uses: actions/upload-artifact@v4
        with:
          name: voynich-exp605-results
          path: |
            experiments/exp_605_folio_sequence_gap_audit/results.json
            experiments/exp_605_folio_sequence_gap_audit/result.md
          if-no-files-found: error
          retention-days: 90
