name: Voynich exp607 held-out bigram prediction

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/exp_607_heldout_bigram_prediction/**'
      - '.github/workflows/voynich-exp607.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test held-out next-token prediction
        run: python experiments/exp_607_heldout_bigram_prediction/script.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add experiments/exp_607_heldout_bigram_prediction/results.json experiments/exp_607_heldout_bigram_prediction/result.md
          git diff --cached --quiet || git commit -m "Record exp607 held-out bigram prediction"
          git push
