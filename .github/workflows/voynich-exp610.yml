name: Voynich exp610 length-stratified ch-sh audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/exp_610_length_stratified_ch_sh_audit/script.py'
      - 'data/transcriptions/eva_zl3b.txt'
      - 'data/transcriptions/eva_it2a.txt'
      - '.github/workflows/voynich-exp610.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run length-stratified audit
        run: python experiments/exp_610_length_stratified_ch_sh_audit/script.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add experiments/exp_610_length_stratified_ch_sh_audit/results.json experiments/exp_610_length_stratified_ch_sh_audit/result.md
          git diff --cached --quiet || git commit -m "Record exp610 length-stratified ch-sh audit"
          for attempt in 1 2 3 4 5; do
            git fetch origin master:refs/remotes/origin/master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite results." >&2
              exit 1
            fi
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying after refresh."
            sleep "$((attempt * 2))"
          done
          echo "Push failed after five attempts." >&2
          exit 1

# Re-run audit after counter initialization fix.
