name: Voynich exp611 exact length-position ch-sh matching

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/exp_611_exact_length_position_ch_sh/**'
      - '.github/workflows/voynich-exp611.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact length-position matching
        run: python experiments/exp_611_exact_length_position_ch_sh/script.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add experiments/exp_611_exact_length_position_ch_sh/results.json experiments/exp_611_exact_length_position_ch_sh/result.md
          git diff --cached --quiet || git commit -m "Record exp611 exact length-position matching"
          git push
