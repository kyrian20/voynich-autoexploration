name: Voynich exp604 independent transcription replication

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/exp_604_independent_transcription_replication/script.py'
      - 'data/transcriptions/eva_it2a.txt'
      - '.github/workflows/voynich-exp604.yml'

# Serialize all workflows that write results to master.
concurrency:
  group: voynich-master-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  exp604:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fixed-protocol IT2a replication
        run: python experiments/exp_604_independent_transcription_replication/script.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/exp_604_independent_transcription_replication/results.json experiments/exp_604_independent_transcription_replication/result.md
          git diff --cached --quiet || git commit -m "Record exp604 IT2a replication results"
          for attempt in 1 2 3 4 5; do
            git fetch origin master:refs/remotes/origin/master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite results." >&2
              exit 1
            fi
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying after refresh."
            sleep "$((attempt * 2))"
          done
          echo "Push failed after five attempts." >&2
          exit 1
