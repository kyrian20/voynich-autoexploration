name: Voynich Independent Parser Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/exp_602_independent_ivtff_parser_audit/**"
      - "data/transcriptions/eva_zl3b.txt"
      - "data/transcriptions/zl3a.txt"
      - ".github/workflows/voynich-independent-parser-audit.yml"

permissions:
  contents: write

concurrency:
  group: voynich-independent-parser-audit
  cancel-in-progress: false

jobs:
  parser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check
        run: python -m py_compile experiments/exp_602_independent_ivtff_parser_audit/script.py
      - name: Run independent parser audit (no API)
        run: python experiments/exp_602_independent_ivtff_parser_audit/script.py
      - name: Upload parser audit results
        uses: actions/upload-artifact@v4
        with:
          name: exp-602-independent-parser-audit
          path: experiments/exp_602_independent_ivtff_parser_audit/results.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit generated results
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain experiments/exp_602_independent_ivtff_parser_audit/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/exp_602_independent_ivtff_parser_audit/results.json
            git commit -m "Record exp_602 independent parser audit"
            git pull --rebase origin master
            git push
          else
            echo "No changes to results."
          fi
